version: '3.8'

services:
  meesho-order-manager:
    build: .
    container_name: meesho-order-manager
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - HEADLESS=true
    volumes:
      # Persist auth sessions, multi-account database, and configs across restarts
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./config.json:/app/config.json
